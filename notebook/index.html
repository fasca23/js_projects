<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>📝 Блокнот</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="notebook-wrapper">
        <h1>📝 Блокнот</h1>

        <div class="toolbar" id="toolbar">
            <div class="tool-group">
                <button id="btnPen" class="tool-btn active" title="Ручка (E)">✏️</button>
                <button id="btnEraser" class="tool-btn" title="Ластик (L)">🧽</button>
            </div>
            <div class="sep"></div>
            <div class="tool-group">
                <button id="btnUndo" class="tool-btn" title="Отменить (Ctrl+Z)">↶</button>
                <button id="btnRedo" class="tool-btn" title="Повторить (Ctrl+Y)">↷</button>
            </div>
            <div class="sep"></div>
            <div class="tool-group palette" id="palette"></div>
            <input type="color" id="colorPicker" class="color-picker" title="Свой цвет">
            <div class="sep"></div>
            <div class="tool-group size-group">
                <span class="size-icon">●</span>
                <input type="range" id="sizeSlider" min="1" max="40" value="3">
                <span id="sizeLabel" class="size-label">3</span>
            </div>
            <div class="sep"></div>
            <div class="tool-group">
                <button id="btnPrevPage" class="tool-btn" title="Предыдущая страница">◀</button>
                <span id="pageLabel" class="size-label">1 / 5</span>
                <button id="btnNextPage" class="tool-btn" title="Следующая страница">▶</button>
            </div>
            <div class="sep"></div>
            <div class="tool-group transfer-group">
                <button id="btnTransfer" class="tool-btn" title="Импорт / экспорт">📦</button>
                <div class="transfer-menu" id="transferMenu" hidden>
                    <button id="btnExport" class="transfer-item">💾 Скачать</button>
                    <button id="btnImport" class="transfer-item">📂 Загрузить</button>
                </div>
            </div>
            <div class="sep"></div>
            <div class="tool-group">
                <button id="btnGrid" class="tool-btn" title="Сетка (G)">▦</button>
                <button id="btnClear" class="tool-btn danger" title="Очистить">🗑️</button>
            </div>
        </div>

        <!-- ОБЁРНУТО В КОНТЕЙНЕР: canvas растягивается по нему -->
        <div class="canvas-host">
            <canvas id="board"></canvas>
        </div>
    <input type="file" id="importFileInput" accept="application/json,.json">
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/strokes.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/input.js"></script>
    <script src="js/toolbar.js"></script>
    <script src="js/notebook.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
